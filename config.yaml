# TempestWX APRS Weather Sender Configuration

# TempestWX API credentials
tempestwx:
  api_key: "YOUR_TEMPEST_API_TOKEN_HERE"
  station_id: "YOUR_STATION_ID_HERE"

# Direwolf KISS TNC settings
direwolf:
  host: "172.16.2.201"
  port: 8001

# APRS settings
aprs:
  callsign: "YOUR_CALLSIGN_HERE"
  ssid: 5  # Your APRS SSID (typically 0-15)
  symbol_table: "/"  # "/" for weather station, "\" for other
  symbol_code: ">"   # ">" for weather station

# Logging configuration
logging:
  # Directory where log files will be stored
  # Default: './logs' (created in the application directory)
  # Alternatives:
  #   Linux/Mac: '/var/log/aprswx' or '/home/username/aprswx/logs'
  #   Windows: 'C:\aprswx\logs' or 'C:\Users\username\AppData\Local\aprswx\logs'
  logdir: "./logs"

# Update interval in minutes
update_interval: 15
